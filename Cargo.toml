[workspace]
members = ["apps/warden-gui"]
default-members = ["."]
resolver = "2"

[package]
name = "warden"
version = "0.18.1"
edition = "2021"
rust-version = "1.95"
description = "Host integrity scanner for macOS and Linux: persistence, backdoors, hardening risks"
license = "MIT"
repository = "https://github.com/yybit/warden"

[[bin]]
name = "warden"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
csv = "1.4.0"
libc = "0.2"
md-5 = "0.10"
ratatui = "0.30.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
toml = "1"
walkdir = "2"
yara-x = "1.22.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
