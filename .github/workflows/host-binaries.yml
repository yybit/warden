name: host-binaries

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'README*'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-aarch64
          - runner: macos-14
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package with checksum
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="warden-${version}-${{ matrix.suffix }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/warden" "dist/${name}"
          chmod +x "dist/${name}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${name}" > "${name}.sha256")
          else
            (cd dist && shasum -a 256 "${name}" > "${name}.sha256")
          fi
          cat "dist/${name}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.suffix }}
          path: dist/*

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
